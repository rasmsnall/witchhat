name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version and pulls in rustfmt and clippy, so the
      # verdict here matches a developer's machine.
      - name: Show toolchain
        run: rustc --version && cargo --version && cargo fmt --version && cargo clippy --version

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Documentation builds without broken links
        run: cargo doc --no-deps -p witchhat-core
        env:
          RUSTDOCFLAGS: -D warnings

  wheel:
    name: manylinux abi3 wheel (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64 covers every Databricks cluster today; aarch64 covers Graviton
        # (AWS) clusters, which Databricks also supports. Both build on a native
        # runner of that architecture (ubuntu-24.04-arm is a real ARM64 machine, not
        # QEMU), so "Round-trip" below actually executes the wheel it just built,
        # not just cross-compiles it.
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # abi3 comes from the pyo3 feature pinned in witchhat-py/Cargo.toml, so one
      # wheel per architecture covers 3.10 and later.
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/witchhat-py
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --out dist

      - name: Verify the wheel is abi3 and imports
        run: |
          set -eux
          ls -l crates/witchhat-py/dist/
          # An abi3 wheel must be tagged cp310-abi3, not cp310-cp310. Without this the
          # single-artefact promise silently becomes false.
          ls crates/witchhat-py/dist/ | grep -q 'cp310-abi3' || { echo "wheel is not abi3"; exit 1; }
          ls crates/witchhat-py/dist/ | grep -q '${{ matrix.arch }}' || { echo "wheel is not tagged ${{ matrix.arch }}"; exit 1; }
          python -m pip install --upgrade pip
          python -m pip install crates/witchhat-py/dist/*.whl
          python -c "
          import witchhat
          print('version', witchhat.__version__)
          print('exports', sorted(witchhat.__all__))
          assert callable(witchhat.hash_rows)
          "

      - name: Round-trip a real pyarrow batch through the wheel
        run: |
          python -m pip install pyarrow
          python tools/smoke.py

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-manylinux-${{ matrix.arch }}
          path: crates/witchhat-py/dist/*.whl
          if-no-files-found: error

  interpreters:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        # One abi3 wheel must load on every interpreter the project claims to support.
        # DBR 16.4 LTS and 17.3 LTS both ship Python 3.12.3, so one 3.12 job covers both;
        # 3.10 is the abi3 floor and 3.13 checks the forward half of the promise.
        # x86_64 only: the wheel job's own native-runner round-trip already proves the
        # aarch64 wheel executes correctly, and duplicating the full interpreter matrix
        # on ARM64 runners would roughly double this job's runtime for the same signal.
        include:
          - python: "3.10"
            label: "Python 3.10 (abi3 floor)"
          - python: "3.12"
            label: "Python 3.12 (DBR 16.4 LTS and 17.3 LTS)"
          - python: "3.13"
            label: "Python 3.13 (abi3 forward compatibility)"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-manylinux-x86_64
          path: dist
      - name: Install and round-trip
        run: |
          set -eux
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl pyarrow
          python -c "import witchhat, sys; print(sys.version); print(witchhat.__version__)"
          python tools/smoke.py
