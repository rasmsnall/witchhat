[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "witchhat"
version = "0.1.0"
description = "High-performance data transformation library for Spark/Databricks workloads, with a Rust core"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
module-name = "witchhat"
features = ["pyo3/extension-module"]
